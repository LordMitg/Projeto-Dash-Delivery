<!--
  Marca do sistema.

  O arquivo anterior era o raio roxo (#863bff) que vem no template do Vite: nada
  a ver com o produto, e ainda por cima na unica cor que a paleta nao usa. Aqui
  ele foi trocado pelo simbolo da identidade — o pudim em dourado sobre o vinho
  do menu lateral.

  Desenhado com traco grosso e poucas formas de proposito: o favicon e visto a
  16px na aba do navegador, tamanho em que qualquer detalhe fino vira borrao.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none" role="img" aria-label="Pudim">
  <rect width="48" height="48" rx="11" fill="#3e0f27" />
  <g stroke="#e0a63a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Corpo: tronco de cone, mais estreito em cima, como um pudim desenformado. -->
    <path d="M13.5 31.5 L18.8 18.5 Q24 15.6 29.2 18.5 L34.5 31.5 Z" />
    <!-- Calda escorrendo pela borda de cima. -->
    <path d="M19.4 20.2 q2.4 2.6 4.6 0 q2.3 -2.6 4.6 0" />
    <!-- Prato. -->
    <path d="M9.5 31.5 h29" />
  </g>
</svg>
