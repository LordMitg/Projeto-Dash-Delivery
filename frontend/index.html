<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      O index.css pede 'Inter' e 'JetBrains Mono', mas nenhuma das duas era
      carregada: o navegador caia no fallback do sistema e a interface inteira
      ficava com a fonte errada. Sao as duas unicas familias do projeto - Inter
      para texto e JetBrains Mono para valores, onde o alinhamento dos digitos
      importa (preco, troco, conferencia de caixa).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Delivery ERP - Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
